<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AgriSense BW{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='img/logo.svg') }}">
  <link rel="preload" href="{{ url_for('static', path='vendor/space-grotesk/SpaceGrotesk-500.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/leaflet/leaflet.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v={{ version('css/style.css') }}">
</head>
<body>
  {% block body %}{% endblock %}
  {# All texts in the page's language, for app.js (see src/i18n.py) #}
  <script id="i18n-data" type="application/json">{{ strings | tojson }}</script>
  <script src="{{ url_for('static', path='vendor/leaflet/leaflet.js') }}"></script>
  <script src="{{ url_for('static', path='vendor/chartjs/chart.umd.min.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
